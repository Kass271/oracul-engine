openapi: 3.0.3
info:
  title: ORACUL API
  version: 0.7.0
  description: |
    Contract between the Spring Boot backend and the Angular frontend. Both sides are generated from this file.
    Every request is tied to an anonymous browser session (HttpOnly cookie ORACUL_SID, created by the backend on the
    first /api request). Data of another session is never visible: it answers 404 like a missing resource.
    Every non-2xx response body is an ApiError { code, message }. No response ever contains a ChatGPT credential.
tags:
  - name: system
    description: Liveness of the backend
  - name: scenario
    description: Scenario Panel — catalogue, defaults and current configuration (spec scenario-panel.md)
  - name: chatgpt
    description: Sign in with ChatGPT, connection status, sign-out and reset (specs phase-01 chatgpt-connection.md, phase-02 chatgpt-connection.md)
  - name: runs
    description: Generation runs — start, progress, stop, alternative futures (specs generation-runs.md, phase-02 run-control.md)
  - name: research
    description: Research profile, search plan (wildcard pipelines), sources, events and Evidence Pack of a run (specs research-pipeline.md, phase-03 wildcard-search.md, article-retrieval.md, wildcard-evidence.md)
  - name: reasoning
    description: Structured scenario, Evidence Guard and critic reports of a run (spec scenario-reasoning.md)
  - name: result
    description: The rendered future — story, metadata, WHY, SOURCES, WHY THESE NEWS (specs future-result.md, phase-03 wildcard-result-views.md)
  - name: history
    description: Recent futures of the browser session (spec recent-futures.md)
paths:
  /api/ping:
    get:
      tags: [system]
      operationId: ping
      summary: Liveness probe used by the skeleton page
      responses:
        '200':
          description: The backend is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'

  /api/scenario/catalogue:
    get:
      tags: [scenario]
      operationId: getScenarioCatalogue
      summary: Wildcard catalogue, horizon options, defaults and limits for the Scenario Panel
      responses:
        '200':
          description: The catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioCatalogue'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/scenario/configuration:
    get:
      tags: [scenario]
      operationId: getScenarioConfiguration
      summary: Current configuration of this session (configuration of the newest run, else the defaults)
      responses:
        '200':
          description: The configuration the panel starts with
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioConfiguration'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/chatgpt/authorize:
    get:
      tags: [chatgpt]
      operationId: startChatGptSignIn
      summary: Browser navigation — starts Sign in with ChatGPT (OAuth 2.0 + PKCE) and redirects to OpenAI
      description: |
        Creates a fresh state, OIDC nonce and PKCE verifier in backend memory (bound to this session, single use,
        10 min) and answers 302 to the OpenAI authorize endpoint. Never answers with a body the user has to read and
        never 4xx/5xx: if the authorize URL cannot be built it answers 302 to <frontend-base-url>/?chatgpt=not_completed.
        First registration (no persisted client id) uses client_id=dynamic_agent_client plus agent_name_hint=ORACUL;
        reauthorization uses the persisted oaiapp_… client id and no agent_name_hint. Both always send
        ext_agent_host_id=urn:uuid:<stable host uuid> and redirect_uri=http://127.0.0.1:4200/callback
        (phase-02 chatgpt-connection.md FR-35).
      responses:
        '302':
          description: Redirect to the OpenAI authorization endpoint (or to <frontend-base-url>/?chatgpt=not_completed on misconfiguration)
          headers:
            Location:
              description: Authorize URL with exactly client_id, [agent_name_hint only for dynamic_agent_client], ext_agent_host_id (urn:uuid:<uuid>), response_type=code, redirect_uri (http://127.0.0.1:<port>/callback), scope (6 scopes, space-separated), resource=https://api.openai.com/v1, state, nonce, code_challenge (BASE64URL(SHA-256(verifier))), code_challenge_method=S256
              schema:
                type: string

  /api/auth/chatgpt/callback:
    get:
      tags: [chatgpt]
      operationId: completeChatGptSignIn
      summary: Browser navigation — OAuth redirect target; exchanges the code and redirects back to ORACUL
      description: |
        Reached through the registered loopback redirect URI http://127.0.0.1:<port>/callback, which the frontend web
        server forwards to this path with the query string unchanged. Checks state, the issued client id, exchanges
        the code (with resource), validates the ID token (RS256 signature against OpenAI's JWKS, iss, aud = issued
        client id, exp, nonce of this attempt) and the granted scopes. Always answers 302 to the ORACUL frontend with
        ?chatgpt=connected | not_completed | not_eligible | not_verified | expired. Never answers 4xx/5xx
        (phase-02 chatgpt-connection.md FR-36).
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code. Longer than 4096 characters → redirect ?chatgpt=not_completed (checked by the service, not by Bean Validation, so the endpoint never answers 400).
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: State created by startChatGptSignIn (single use, 10 min). Missing, unknown, used, expired or longer than 512 → ?chatgpt=not_completed without a token request.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: OAuth error (e.g. access_denied). Any value → pending entry removed, ?chatgpt=not_completed. Limit 256.
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          description: Ignored and never echoed. Limit 2048.
          schema:
            type: string
        - name: client_id
          in: query
          required: false
          description: Issued client id (oaiapp_…, pattern ^oaiapp_[A-Za-z0-9_-]{1,249}$). First registration - required (missing or other value → not_completed, nothing persisted); persisted after a successful token exchange and ID-token validation. Reauthorization - absent or equal to the stored id, any other value → not_completed and the stored id stays unchanged. Limit 256 (checked by the service).
          schema:
            type: string
      responses:
        '302':
          description: Redirect back to the ORACUL frontend with the outcome in the chatgpt query parameter
          headers:
            Location:
              description: Exactly <frontend-base-url>/?chatgpt=connected|not_completed|not_eligible|not_verified|expired (never contains code, state, nonce, error, error_description or a token)
              schema:
                type: string

  /api/auth/chatgpt/connection:
    get:
      tags: [chatgpt]
      operationId: getChatGptConnection
      summary: ChatGPT connection state of this session
      description: Reads backend memory only (no call to OpenAI, no refresh). Creates the ORACUL_SID session cookie when missing.
      responses:
        '200':
          description: Connection state (never contains a token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatGptConnection'
              examples:
                notConnected:
                  value: { state: NOT_CONNECTED, canGenerate: false }
                connected:
                  value: { state: CONNECTED, canGenerate: true }
                planNotEligible:
                  value: { state: PLAN_NOT_ELIGIBLE, canGenerate: false }
                sessionExpired:
                  value: { state: SESSION_EXPIRED, canGenerate: false }
                registrationInvalid:
                  value: { state: REGISTRATION_INVALID, canGenerate: false }
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [chatgpt]
      operationId: disconnectChatGpt
      summary: Disconnect — drops every credential of this session from backend memory (idempotent)
      description: Best-effort revocation of the session's refresh token at OpenAI's revocation endpoint first (outcome ignored), then the session's credentials, pending sign-ins and flag are dropped.
      responses:
        '204':
          description: Disconnected (also when nothing was connected)
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/chatgpt/registration:
    delete:
      tags: [chatgpt]
      operationId: resetChatGptRegistration
      summary: Reset ChatGPT connection — forget the issued client id and every runtime token (installation-wide)
      description: |
        Refused with 409 RUN_IN_PROGRESS while any generation run is QUEUED or RUNNING (nothing changes). Otherwise:
        best-effort revocation of every held refresh token (outcome ignored), all sessions' credentials, pending
        sign-ins and flags dropped, chatgpt_client_registration.client_id set to NULL. The host id is kept, so the
        next sign-in is a first registration (client_id=dynamic_agent_client, agent_name_hint=ORACUL) with the same
        ext_agent_host_id. Idempotent (phase-02 chatgpt-connection.md FR-37).
      responses:
        '204':
          description: Registration and tokens cleared (also when nothing was stored)
        '409':
          $ref: '#/components/responses/RunInProgress'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs:
    post:
      tags: [runs]
      operationId: startRun
      summary: GENERATE THE FUTURE — snapshot the configuration into a new Generation Run and start the pipeline
      description: |
        Check order: body validation → ChatGPT connection (401 CHATGPT_NOT_CONNECTED / CHATGPT_SESSION_EXPIRED /
        CHATGPT_REGISTRATION_INVALID, 403 CHATGPT_PLAN_NOT_ELIGIBLE, 503 CHATGPT_UNAVAILABLE when a needed token refresh
        fails transiently) → single active run. The first body violation wins, in the
        order JSON syntax → realism → darkness → optimism → horizon → wildcards → customWildcards → output
        (messages in scenario-panel.md). realism/darkness/optimism must be JSON integers (no strings or fractions);
        horizon codes are case-sensitive. Unknown properties are ignored. Nothing is stored when a check fails.
        Wildcards are checked element by element in array order (id → duplicate → intensity): unknown id →
        "unknown wildcard: <id>"; id missing/null/non-string → "wildcards[<i>].wildcardId is invalid"; repeated id →
        "duplicate wildcard: <id>"; intensity not an integer 1–10 → "wildcard intensity must be between 1 and 10";
        wildcards missing/null/not an array of objects → "wildcards is invalid". customWildcards: missing/null/not
        an array of objects → "customWildcards is invalid"; more than 3 → "At most 3 custom wildcards"; then per
        element in array order: label (trimmed) blank, > 40 characters, missing or not a string → "Wildcard name must
        be 1–40 characters"; label equal (trimmed, case-insensitive) to an earlier one → "This wildcard already
        exists"; intensity not an integer 1–10 → "wildcard intensity must be between 1 and 10". output: missing/null/
        not an object or story not true → "Story output is required"; illustration not false → "Illustration is not
        available yet (MVP+1)". All 400 VALIDATION_FAILED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioConfiguration'
      responses:
        '202':
          description: |
            Run accepted and started asynchronously. The body is the committed QUEUED row: status QUEUED, kind
            STANDARD, stageIndex 0, stageCount 10, no stage/stageLabel, configuration equal to the request (unknown
            properties dropped), counts all 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ChatGptRequired'
        '403':
          $ref: '#/components/responses/PlanNotEligible'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ChatGptUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [history]
      operationId: listRecentRuns
      summary: Recent futures — the 20 newest COMPLETED or STOPPED runs of this session, newest first
      description: |
        Runs of the caller's browser session (cookie ORACUL_SID; none/unknown → new session → empty list) with status
        COMPLETED and a headline, or with status STOPPED (phase-02 run-control.md FR-45), ordered by createdAt desc,
        ties by id desc, at most 20. FAILED, INSUFFICIENT_EVIDENCE, QUEUED and RUNNING runs, COMPLETED runs without a
        headline and runs of other sessions are never listed. Every item carries `status`; `headline` only when
        COMPLETED. Older runs stay stored and reachable via getRun / getFutureResult. No parameters.
      responses:
        '200':
          description: Recent futures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentRunList'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{runId}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Run status, current stage and counts — polled about every second while the run is active
      description: |
        Only runs of the caller's browser session are visible; an unknown, malformed or foreign runId answers
        404 RUN_NOT_FOUND "Future not found". Every stage transition is committed before the stage's work starts.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{runId}/stop:
    post:
      tags: [runs]
      operationId: stopRun
      summary: STOP — end a QUEUED or RUNNING run as STOPPED; no further ChatGPT or news request is sent for it
      description: |
        No request body (a body is ignored). No ChatGPT connection check (a run can be stopped while disconnected).
        Unknown, malformed or foreign runId → 404 RUN_NOT_FOUND "Future not found". Run QUEUED or RUNNING → one
        conditional commit sets status STOPPED, completedAt = updatedAt = now (stage and stageIndex stay those of the
        moment of the stop, 0 / absent when it was QUEUED; failure, headline and suggestedRealism stay absent) and
        frees the session's active-run slot; every later run-guard check of the pipeline fails, so no ChatGPT, model
        catalogue, token refresh, news search (Google News RSS) or article retrieval request starts for the run afterwards
        and the answers of requests still in flight are discarded. Run already terminal (COMPLETED, FAILED,
        INSUFFICIENT_EVIDENCE, STOPPED), also when it ended between the client's last poll and this request → nothing
        changes. The 200 body is getRun of the run after the request (phase-02 run-control.md FR-45).
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run after the request — STOPPED, or unchanged when it was already terminal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{runId}/alternatives:
    post:
      tags: [runs]
      operationId: startAlternativeRun
      summary: ALTERNATIVE FUTURE — new run with the same configuration and the same Evidence Pack, different causal path
      description: |
        No request body (a body is ignored). Checks in this order: runId unknown, malformed or of another session →
        404 RUN_NOT_FOUND "Future not found"; ChatGPT not connected → 401 CHATGPT_NOT_CONNECTED "Connect ChatGPT to
        generate"; refresh failed → 401 CHATGPT_SESSION_EXPIRED "ChatGPT session expired — please reconnect" (refresh
        invalid_client → 401 CHATGPT_REGISTRATION_INVALID; transient refresh failure → 503 CHATGPT_UNAVAILABLE); plan not
        eligible → 403 CHATGPT_PLAN_NOT_ELIGIBLE "Your ChatGPT plan is not eligible for ORACUL"; parent not COMPLETED
        with an accepted scenario and an Evidence Pack (FAILED, INSUFFICIENT_EVIDENCE, STOPPED, QUEUED, RUNNING, or
        COMPLETED without them) → 409 RUN_NOT_COMPLETED "Only a completed future can have an alternative"; another run of the
        session QUEUED/RUNNING → 409 RUN_ALREADY_ACTIVE "A generation is already running". Nothing is stored on an error.
        202 body: kind ALTERNATIVE, parentRunId = runId, status QUEUED, stageIndex 0, configuration deep-equal to the
        parent's, evidencePackId = the parent's, counts equal to the parent's, evidenceNote and suggestedRealism equal
        to the parent's (phase-02 run-control.md FR-47). The run skips stages 1–6 (no search;
        it goes from QUEUED to EXPLORING_FUTURES), lists the parent's and every earlier future on the same Evidence Pack
        as futures to avoid, and ends FAILED ALTERNATIVE_NOT_DISTINCT when its future repeats one of them after one
        regeneration (FR-30).
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '202':
          description: Alternative run accepted (kind ALTERNATIVE, same evidencePackId as the parent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationRun'
        '401':
          $ref: '#/components/responses/ChatGptRequired'
        '403':
          $ref: '#/components/responses/PlanNotEligible'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ChatGptUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{runId}/research:
    get:
      tags: [research]
      operationId: getRunResearch
      summary: Research Profile, search plan (intents, buckets, queries) and research counts of a run
      description: |
        200 as soon as the Research Profile is stored (stage UNDERSTANDING); searchPlan is absent until the plan is
        committed during RESEARCH_STRATEGY (all queries PENDING), and the query status / articlesReturned are updated
        when SEARCHING finishes. Runs created since phase 03 have one wildcard pipeline per enabled wildcard (or one
        General pipeline) in searchPlan.pipelines and empty buckets / intents / queries; candidatesConsidered and
        sourceIds of each pipeline appear when READING_SOURCES commits (phase-03 wildcard-search.md FR-50–FR-52,
        article-retrieval.md FR-53). Before the profile exists → 409 RESEARCH_NOT_READY "Research has not started yet".
        Unknown, malformed or foreign runId → 404 RUN_NOT_FOUND "Future not found".
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Research record of the run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResearch'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{runId}/sources:
    get:
      tags: [research]
      operationId: listRunSources
      summary: Every source retrieved for the run after basic filtering (S001…)
      description: |
        Items ordered by id. `items` is empty until READING_SOURCES commits the sources (also for a run whose news
        search found nothing). Since phase-02 slice 03 a run keeps at most 30 sources (news-search.md FR-46). Since
        phase 03 the sources are the kept selections of the wildcard pipelines, numbered in Evidence order (S00k is
        Evidence ID E00k), with contentStatus, excerpts, publisherHost and pipelineIds (article-retrieval.md FR-53,
        FR-54). For an ALTERNATIVE run: the sources of the run that built its Evidence Pack. Unknown, malformed or
        foreign runId → 404 RUN_NOT_FOUND "Future not found".
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Sources of the run (empty while searching)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{runId}/events:
    get:
      tags: [research]
      operationId: listRunEvents
      summary: Normalized events of the run with classification, ranking and selection
      description: |
        `items` is empty until stage CONNECTING_SIGNALS commits the events (also for a run that failed before or
        during that stage). Order: ranked events by `ranking.score` descending (ties: sourceQuality desc, date desc,
        id), then unranked events (excluded, or before RANKING) by id ascending — before ranking exists this is id
        order EV001, EV002, …. For an ALTERNATIVE run: the events of the run that built its Evidence Pack. Unknown,
        malformed or foreign runId → 404 RUN_NOT_FOUND "Future not found".
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Events of the run (empty before normalisation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{runId}/evidence-pack:
    get:
      tags: [research]
      operationId: getEvidencePack
      summary: The Evidence Pack of the run — exactly the current-world context given to ChatGPT
      description: |
        200 once stage RANKING has committed the pack (`GenerationRun.evidencePackId` set); the pack is immutable, so
        repeated calls return identical bodies. Also returned for a run whose pack is empty (no evidence item — the
        run then writes a speculative future, run-control.md FR-47) and for stored INSUFFICIENT_EVIDENCE runs. Packs
        built since phase 03 are grouped by wildcard: core, supporting and counterSignals are empty and
        wildcardSections holds one section per pipeline (phase-03 wildcard-evidence.md FR-57). An ALTERNATIVE run
        returns its parent's pack (same id, identical body) from creation on.
        Run QUEUED / RUNNING before that commit, or ended before stage RANKING → 409 EVIDENCE_PACK_NOT_READY
        "The Evidence Pack is not ready yet". Unknown, malformed or foreign runId → 404 RUN_NOT_FOUND "Future not found".
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The Evidence Pack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePack'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{runId}/structured-scenario:
    get:
      tags: [reasoning]
      operationId: getStructuredScenario
      summary: Final structured scenario of the run with its Evidence Guard and critic reports
      description: |
        200 as soon as one generation attempt with a parsed scenario is committed (any run status, also FAILED
        SCENARIO_REJECTED). `structuredScenario` is the latest parsed attempt's scenario — the cleaned version when
        its Evidence Guard outcome was PASS / PASS_WITH_REMOVALS, otherwise as parsed; `accepted` tells whether that
        attempt is the run's final scenario. Run QUEUED / RUNNING before the first parsed attempt, FAILED before
        stage EXPLORING_FUTURES, FAILED INVALID_SCENARIO, INSUFFICIENT_EVIDENCE, STOPPED before the first parsed
        attempt, or a stored COMPLETED run without a scenario (empty Evidence Pack before phase-02 slice 03) →
        409 SCENARIO_NOT_READY "The scenario is not ready yet". Unknown, malformed or foreign runId → 404
        RUN_NOT_FOUND "Future not found". `criticReports` lists one report per critiqued attempt (the critic runs
        only on attempts whose Evidence Guard outcome is PASS / PASS_WITH_REMOVALS), attempt ascending; a critic
        output that stays malformed after one retry is stored as verdict PASS with no issues.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Structured scenario record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredScenarioRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{runId}/result:
    get:
      tags: [result]
      operationId: getFutureResult
      summary: Everything the result view renders — story, labels, metadata, causal chain, sources, research summary
      description: |
        200 only for a COMPLETED run that has a stored future story (stage WRITING_STORY done). Run QUEUED / RUNNING,
        FAILED, INSUFFICIENT_EVIDENCE, STOPPED, or a stored COMPLETED run without a story (empty Evidence Pack before
        phase-02 slice 03) → 409
        RESULT_NOT_READY "This future is not ready yet". Unknown, malformed or foreign runId → 404 RUN_NOT_FOUND
        "Future not found". All values come from the run snapshot, never from the current panel configuration.
        Runs whose search plan has wildcard pipelines (since phase 03) also carry wildcardGroups, which the SOURCES and
        WHY THESE NEWS? panels render grouped by wildcard (phase-03 wildcard-result-views.md FR-60).
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The future result of a COMPLETED run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutureResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      description: Run id (UUID). A malformed id or a run of another session answers 404 RUN_NOT_FOUND.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation failed (code VALIDATION_FAILED); message names the first violated rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            darkness:
              value: { code: VALIDATION_FAILED, message: darkness must be between 1 and 10 }
            optimism:
              value: { code: VALIDATION_FAILED, message: optimism must be between 1 and 10 }
            realism:
              value: { code: VALIDATION_FAILED, message: realism must be between 1 and 10 }
            horizon:
              value: { code: VALIDATION_FAILED, message: unknown horizon }
            invalidJson:
              value: { code: VALIDATION_FAILED, message: Request body is not valid JSON }
    ChatGptRequired:
      description: CHATGPT_NOT_CONNECTED, CHATGPT_SESSION_EXPIRED or CHATGPT_REGISTRATION_INVALID (refresh answered invalid_client)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            notConnected:
              value: { code: CHATGPT_NOT_CONNECTED, message: Connect ChatGPT to generate }
            expired:
              value: { code: CHATGPT_SESSION_EXPIRED, message: ChatGPT session expired — please reconnect }
            registrationInvalid:
              value: { code: CHATGPT_REGISTRATION_INVALID, message: ChatGPT registration is no longer valid — use Reset ChatGPT connection, then reconnect }
    ChatGptUnavailable:
      description: CHATGPT_UNAVAILABLE — a needed token refresh failed transiently (5xx, timeout, network); credentials are kept
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            unavailable:
              value: { code: CHATGPT_UNAVAILABLE, message: ChatGPT is temporarily unavailable — try again in a few minutes }
    RunInProgress:
      description: RUN_IN_PROGRESS — the ChatGPT connection cannot be reset while a generation run is QUEUED or RUNNING
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            runInProgress:
              value: { code: RUN_IN_PROGRESS, message: Wait until the current run finishes }
    PlanNotEligible:
      description: CHATGPT_PLAN_NOT_ELIGIBLE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            planNotEligible:
              value: { code: CHATGPT_PLAN_NOT_ELIGIBLE, message: Your ChatGPT plan is not eligible for ORACUL }
    NotFound:
      description: RUN_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            runNotFound:
              value: { code: RUN_NOT_FOUND, message: Future not found }
    Conflict:
      description: RUN_ALREADY_ACTIVE, RUN_NOT_COMPLETED, RESEARCH_NOT_READY, EVIDENCE_PACK_NOT_READY, SCENARIO_NOT_READY or RESULT_NOT_READY
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            runAlreadyActive:
              value: { code: RUN_ALREADY_ACTIVE, message: A generation is already running }
            runNotCompleted:
              value: { code: RUN_NOT_COMPLETED, message: Only a completed future can have an alternative }
            researchNotReady:
              value: { code: RESEARCH_NOT_READY, message: Research has not started yet }
            evidencePackNotReady:
              value: { code: EVIDENCE_PACK_NOT_READY, message: The Evidence Pack is not ready yet }
            scenarioNotReady:
              value: { code: SCENARIO_NOT_READY, message: The scenario is not ready yet }
            resultNotReady:
              value: { code: RESULT_NOT_READY, message: This future is not ready yet }
    InternalError:
      description: Last-resort INTERNAL_ERROR without internals (no stack trace, no provider body, no token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            internal:
              value: { code: INTERNAL_ERROR, message: Something went wrong — try again }

  schemas:
    Ping:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine code, e.g. VALIDATION_FAILED, RUN_ALREADY_ACTIVE
        message:
          type: string
          description: User-facing English message; never contains internals or credentials

    # ---------- scenario ----------
    HorizonCode:
      type: string
      description: 1d Tomorrow · 1w 1 week · 1m 1 month · 1y 1 year · 5y 5 years · 10y 10 years · 20y 20 years
      enum: ['1d', '1w', '1m', '1y', '5y', '10y', '20y']

    ScenarioConfiguration:
      type: object
      description: Snapshot of the Scenario Panel. Darkness and Optimism are independent.
      required: [realism, darkness, optimism, horizon, wildcards, customWildcards, output]
      properties:
        realism:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
        darkness:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
        optimism:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
        horizon:
          $ref: '#/components/schemas/HorizonCode'
        wildcards:
          type: array
          description: Enabled catalogue wildcards only (a disabled wildcard is absent). Ids unique and from the catalogue (30 ids, so at most 30 entries).
          maxItems: 30
          items:
            $ref: '#/components/schemas/WildcardSetting'
        customWildcards:
          type: array
          description: Custom wildcards in panel order (≤ 3, labels trimmed and unique case-insensitively). Missing/null/not an array of objects → "customWildcards is invalid"; more than 3 → "At most 3 custom wildcards".
          maxItems: 3
          items:
            $ref: '#/components/schemas/CustomWildcard'
        output:
          $ref: '#/components/schemas/OutputSettings'

    WildcardSetting:
      type: object
      required: [wildcardId, intensity]
      properties:
        wildcardId:
          type: string
          minLength: 1
          maxLength: 60
          pattern: '^[a-z0-9-]+$'
          description: Id of a WildcardDefinition from getScenarioCatalogue (case-sensitive)
          example: biology-new-pandemic
        intensity:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          description: JSON integer 1–10 (no strings or fractions); UI default 5 when enabled
          example: 8

    CustomWildcard:
      type: object
      required: [label, intensity]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: |
            Free text (JSON string only, no coercion). The backend trims it before validation, so the 1–40 limit
            applies to the trimmed label ("  " + 40 chars + "  " is valid and stored as the 40 chars); blank → invalid.
            Labels must be unique within the request (trimmed, case-insensitive). Violations → 400 VALIDATION_FAILED
            "Wildcard name must be 1–40 characters" / "This wildcard already exists".
        intensity:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          description: JSON integer 1–10 (no strings or fractions); UI default 5 when added

    OutputSettings:
      type: object
      required: [story, illustration]
      properties:
        story:
          type: boolean
          description: Must be JSON true in this version; anything else (or output missing/null) → 400 VALIDATION_FAILED "Story output is required"
        illustration:
          type: boolean
          description: Must be JSON false in this version (MVP+1); anything else → 400 VALIDATION_FAILED "Illustration is not available yet (MVP+1)" (checked after story)

    ScenarioCatalogue:
      type: object
      description: defaults = realism 8, darkness 5, optimism 5, horizon 1y, wildcards [], customWildcards [], output {story true, illustration false}
      required: [categories, horizons, defaults, limits]
      properties:
        categories:
          type: array
          description: The 9 categories ai, robotics, biology, political, economy, energy, environment, space, extreme in this order, 30 wildcards in total (scenario-panel.md)
          minItems: 9
          maxItems: 9
          items:
            $ref: '#/components/schemas/WildcardCategory'
        horizons:
          type: array
          description: Always the 7 options in the order 1d, 1w, 1m, 1y, 5y, 10y, 20y with labels Tomorrow, 1 week, 1 month, 1 year, 5 years, 10 years, 20 years
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/HorizonOption'
        defaults:
          $ref: '#/components/schemas/ScenarioConfiguration'
        limits:
          $ref: '#/components/schemas/ScenarioLimits'

    WildcardCategory:
      type: object
      required: [id, label, wildcards]
      properties:
        id:
          type: string
          example: biology
        label:
          type: string
          example: Biology
        wildcards:
          type: array
          items:
            $ref: '#/components/schemas/WildcardDefinition'

    WildcardDefinition:
      type: object
      required: [id, label, categoryId]
      properties:
        id:
          type: string
          example: biology-new-pandemic
        label:
          type: string
          example: New pandemic
        categoryId:
          type: string
          example: biology

    HorizonOption:
      type: object
      required: [code, label]
      properties:
        code:
          $ref: '#/components/schemas/HorizonCode'
        label:
          type: string
          example: 5 years

    ScenarioLimits:
      type: object
      required: [intensityMin, intensityMax, customWildcardMax, customWildcardLabelMaxLength, defaultWildcardIntensity]
      properties:
        intensityMin:
          type: integer
          format: int32
          example: 1
        intensityMax:
          type: integer
          format: int32
          example: 10
        customWildcardMax:
          type: integer
          format: int32
          example: 3
        customWildcardLabelMaxLength:
          type: integer
          format: int32
          example: 40
        defaultWildcardIntensity:
          type: integer
          format: int32
          example: 5

    # ---------- chatgpt ----------
    ChatGptConnectionState:
      type: string
      description: REGISTRATION_INVALID - a refresh answered invalid_client; only Reset ChatGPT connection helps (phase-02 chatgpt-inference.md FR-40)
      enum: [NOT_CONNECTED, CONNECTED, PLAN_NOT_ELIGIBLE, SESSION_EXPIRED, REGISTRATION_INVALID]

    ChatGptConnection:
      type: object
      required: [state, canGenerate]
      properties:
        state:
          $ref: '#/components/schemas/ChatGptConnectionState'
        canGenerate:
          type: boolean
          description: true only when state is CONNECTED

    # ---------- runs ----------
    RunKind:
      type: string
      enum: [STANDARD, ALTERNATIVE]

    RunStatus:
      type: string
      description: |
        QUEUED and RUNNING are active; the others are terminal. STOPPED = ended by the user's STOP (stopRun, phase-02
        run-control.md FR-45). INSUFFICIENT_EVIDENCE is no longer produced since phase-02 slice 03 (FR-47: a lack of
        evidence never ends a run; the run completes with an evidenceNote); stored runs keep it.
      enum: [QUEUED, RUNNING, COMPLETED, INSUFFICIENT_EVIDENCE, FAILED, STOPPED]

    RunStage:
      type: string
      enum:
        - UNDERSTANDING
        - RESEARCH_STRATEGY
        - SEARCHING
        - READING_SOURCES
        - CONNECTING_SIGNALS
        - RANKING
        - EXPLORING_FUTURES
        - CHALLENGING_ASSUMPTIONS
        - CONSTRUCTING_SCENARIO
        - WRITING_STORY

    RunFailureCode:
      type: string
      description: |
        Why a run ended without a story (generation-runs.md "Run failure codes and messages", phase-02
        chatgpt-inference.md FR-38–40). NEWS_UNAVAILABLE and INSUFFICIENT_EVIDENCE are no longer produced since phase-02
        slice 03 (run-control.md FR-47: no news and too little evidence never end a run); stored runs keep them.
        Fixed messages:
        NEWS_UNAVAILABLE "ORACUL could not reach its news sources — try again later" · CHATGPT_RATE_LIMITED "ChatGPT
        usage limit reached — try again later" (UI links ChatGPT Settings → Usage) · CHATGPT_UNAVAILABLE "ChatGPT is
        temporarily unavailable — try again in a few minutes" (after at most 2 retries) · CHATGPT_SESSION_EXPIRED
        "ChatGPT session expired — please reconnect" · CHATGPT_PLAN_NOT_ELIGIBLE "Your ChatGPT plan is not eligible for
        ORACUL — a personal Plus or Pro plan is needed" · CHATGPT_REGISTRATION_INVALID "ChatGPT registration is no
        longer valid — use Reset ChatGPT connection, then reconnect" · CHATGPT_INCOMPLETE "ChatGPT did not finish the
        answer — please try again" · CHATGPT_REQUEST_REJECTED "ChatGPT rejected ORACUL's request — please report this"
        (providerCode set) · CHATGPT_UNEXPECTED_ERROR "ChatGPT returned an unexpected error (<providerCode>) — please
        try again" (providerCode set) · CHATGPT_NO_MODEL "ChatGPT offers no model for this account — check your plan,
        then try again" · RUN_TIMEOUT "Generation took
        too long — try again" (QUEUED/RUNNING run with now >= deadlineAt; scheduler every 5 s or pipeline check) ·
        INVALID_SCENARIO "ORACUL could not construct a valid scenario" · SCENARIO_REJECTED "ORACUL could not construct
        a scenario supported by current evidence" · ALTERNATIVE_NOT_DISTINCT "ORACUL could not find a different
        future — try changing a setting" · INSUFFICIENT_EVIDENCE "ORACUL found insufficient current evidence to
        construct this scenario at Realism <n>." (n = configuration.realism; only with status INSUFFICIENT_EVIDENCE,
        set at stage RANKING when the Evidence Pack has fewer CORE items than oracul.evidence.min-core for that
        realism — 9–10 → 5, 6–8 → 3, 1–5 → 1) · RUN_INTERRUPTED "Generation was interrupted — try again" (active
        at backend start) · INTERNAL_ERROR "Something went wrong — try again".
      enum:
        - NEWS_UNAVAILABLE
        - CHATGPT_RATE_LIMITED
        - CHATGPT_UNAVAILABLE
        - CHATGPT_SESSION_EXPIRED
        - CHATGPT_PLAN_NOT_ELIGIBLE
        - CHATGPT_REGISTRATION_INVALID
        - CHATGPT_INCOMPLETE
        - CHATGPT_REQUEST_REJECTED
        - CHATGPT_UNEXPECTED_ERROR
        - CHATGPT_NO_MODEL
        - RUN_TIMEOUT
        - INVALID_SCENARIO
        - SCENARIO_REJECTED
        - ALTERNATIVE_NOT_DISTINCT
        - INSUFFICIENT_EVIDENCE
        - RUN_INTERRUPTED
        - INTERNAL_ERROR

    RunFailure:
      type: object
      description: |
        Set on GenerationRun iff status is FAILED or INSUFFICIENT_EVIDENCE; absent otherwise. Keys code and message,
        plus providerCode only for CHATGPT_REQUEST_REJECTED and CHATGPT_UNEXPECTED_ERROR; message is the fixed text of
        the code (see RunFailureCode) and never contains stack traces, provider bodies, URLs, JSON or tokens.
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/RunFailureCode'
        message:
          type: string
          description: User-facing message; never technical details
        providerCode:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_.:-]{1,64}$'
          description: Sanitized OpenAI error code (unknown_error when the provider value does not match the pattern; http_<status> when the answer had no code). Present only for CHATGPT_REQUEST_REJECTED and CHATGPT_UNEXPECTED_ERROR.
          example: subscription_sharing_route_not_supported

    ResearchCounts:
      type: object
      required: [searches, articlesRetrieved, articlesConsidered, uniqueEvents, eventsSelected, counterSignals, sourcesUsed]
      properties:
        searches:
          type: integer
          format: int32
          minimum: 0
          description: Planned search queries (OK + EMPTY + FAILED). Since phase 03 every query is sent as its own Google News RSS request (phase-03 wildcard-search.md FR-52); phase-02 runs used OR-group requests (news-search.md FR-48)
        articlesRetrieved:
          type: integer
          format: int32
          minimum: 0
          description: Raw items returned by the news search (sum of articlesReturned over all queries)
        articlesConsidered:
          type: integer
          format: int32
          minimum: 0
          description: |
            Since phase 03 - distinct usable search results over all wildcard pipelines after basic filtering (the
            candidates the selection considered; phase-03 article-retrieval.md FR-53). Phase-02 runs - stored sources
            (at most 30, news-search.md FR-46); older runs - articles after basic filtering.
        uniqueEvents:
          type: integer
          format: int32
          minimum: 0
        eventsSelected:
          type: integer
          format: int32
          minimum: 0
          description: Evidence Pack size - distinct Evidence IDs (phase 03 - sources of the wildcard sections; earlier - core + supporting + counter-signals)
        counterSignals:
          type: integer
          format: int32
          minimum: 0
          description: Counter-signal items of the pack; always 0 since phase 03 (wildcard-grouped packs have no counter-signal section)
        sourcesUsed:
          type: integer
          format: int32
          minimum: 0
          description: Evidence items cited by factsUsed of the final scenario
        sourcesKept:
          type: integer
          format: int32
          minimum: 0
          maximum: 30
          description: Stored sources after the per-wildcard selection and the 30-source cap (phase-03 article-retrieval.md FR-53). Always sent for runs created since phase 03; absent for older runs.
        sourcesWithContent:
          type: integer
          format: int32
          minimum: 0
          maximum: 30
          description: Stored sources whose publisher article text was retrieved (contentStatus RETRIEVED, phase-03 article-retrieval.md FR-54). Always sent for runs created since phase 03; absent for older runs.

    GenerationRun:
      type: object
      required: [id, generationId, kind, status, stageIndex, stageCount, configuration, counts, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        generationId:
          type: string
          pattern: '^ORC-\d{4}-\d{2}-\d{2}-\d{4}(-\d+)?$'
          example: ORC-2026-10-02-1842
        kind:
          $ref: '#/components/schemas/RunKind'
        parentRunId:
          type: string
          format: uuid
          description: Set iff kind is ALTERNATIVE — the run the alternative was started from (startAlternativeRun runId)
        status:
          $ref: '#/components/schemas/RunStatus'
        stage:
          $ref: '#/components/schemas/RunStage'
        stageLabel:
          type: string
          description: |
            Fixed label of `stage`, absent while QUEUED: Understanding your future… · Building research strategy… ·
            Searching current events… · Reading relevant sources… · Connecting signals… · Ranking evidence… ·
            Exploring possible futures… · Challenging assumptions… · Constructing scenario… · Writing from the future…
          example: Searching current events…
        stageIndex:
          type: integer
          format: int32
          minimum: 0
          maximum: 10
          description: 1-based index of the current stage, 0 while QUEUED, 10 when terminal after WRITING_STORY, 6 (stage RANKING) for stored INSUFFICIENT_EVIDENCE runs; a STOPPED run keeps the index of the stage it was stopped in (0 when stopped while QUEUED)
        stageCount:
          type: integer
          format: int32
          minimum: 10
          maximum: 10
          description: Always 10
          example: 10
        configuration:
          $ref: '#/components/schemas/ScenarioConfiguration'
        evidencePackId:
          type: string
          format: uuid
        counts:
          $ref: '#/components/schemas/ResearchCounts'
        failure:
          $ref: '#/components/schemas/RunFailure'
        suggestedRealism:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          description: |
            max(1, realism − 2) (e.g. 10 → 8, 2 → 1), set iff configuration.realism > 1 and either evidenceNote.kind is
            INSUFFICIENT_EVIDENCE (phase-02 run-control.md FR-47) or status is a stored INSUFFICIENT_EVIDENCE (FR-31).
            Absent otherwise (realism 1, NO_EVIDENCE note, no note). The UI's LOWER REALISM sets the panel realism to
            this value and starts a new run.
        evidenceNote:
          $ref: '#/components/schemas/EvidenceNote'
        headline:
          type: string
          minLength: 1
          maxLength: 160
          description: Headline of the future story; set only when COMPLETED with a story (absent while active, for FAILED / INSUFFICIENT_EVIDENCE / STOPPED and for stored COMPLETED runs without a story)
        hasOpenCriticIssues:
          type: boolean
          description: |
            Always sent by the backend from slice 10 on. True iff the run has an accepted scenario (stage
            CONSTRUCTING_SCENARIO done) and the critic report of that accepted attempt has verdict FAIL (the critic
            failed twice and the guard passed); false otherwise (also while no scenario is accepted, and for FAILED /
            INSUFFICIENT_EVIDENCE runs that never accepted one).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    EvidenceNoteKind:
      type: string
      description: |
        INSUFFICIENT_EVIDENCE = the Evidence Pack has items but fewer core items than the chosen realism needs (in a
        wildcard-grouped pack every item counts as core); NO_EVIDENCE = the Evidence Pack is empty (no usable news at
        all) and the future is fully speculative; MISSING_WILDCARD_SOURCES = the pack has enough items but at least
        one wildcard found no current source (phase-03 wildcard-evidence.md FR-59)
      enum: [INSUFFICIENT_EVIDENCE, NO_EVIDENCE, MISSING_WILDCARD_SOURCES]

    EvidenceNote:
      type: object
      description: |
        Note shown at the end of the result (phase-02 run-control.md FR-47). Set from the commit of stage RANKING on
        (copied from the parent for an ALTERNATIVE run) iff the pack is empty (NO_EVIDENCE, wins over
        INSUFFICIENT_EVIDENCE) or coreItems < coreNeeded (INSUFFICIENT_EVIDENCE) or, since phase 03, a wildcard
        pipeline without sources (MISSING_WILDCARD_SOURCES, unless INSUFFICIENT_EVIDENCE applies); absent when the
        evidence meets the realism and every wildcard has sources, and for runs before phase-02 slice 03. Fixed
        messages: INSUFFICIENT_EVIDENCE "Realism <r> couldn't be fully met: only <coreItems> core evidence item(s)
        (needs <coreNeeded>). This future is less grounded." — "item" when coreItems is 1, else "items" — prefixed by
        the missing-wildcards sentence and one space when wildcardsWithoutSources is present; NO_EVIDENCE "No current
        news could be used — this future is speculative, not grounded in evidence."; MISSING_WILDCARD_SOURCES "No
        current sources found for: <label>, <label>. This part of the future is speculative."
      required: [kind, message, coreItems, coreNeeded]
      properties:
        kind:
          $ref: '#/components/schemas/EvidenceNoteKind'
        message:
          type: string
          minLength: 1
          maxLength: 2000
          example: "Realism 10 couldn't be fully met: only 2 core evidence items (needs 5). This future is less grounded."
        coreItems:
          type: integer
          format: int32
          minimum: 0
          description: CORE items of the run's Evidence Pack (0 for NO_EVIDENCE)
        coreNeeded:
          type: integer
          format: int32
          minimum: 0
          maximum: 10
          description: oracul.evidence.min-core of the realism band (9–10 high, 6–8 medium, 1–5 low) at the time of RANKING
        wildcardsWithoutSources:
          type: array
          description: Labels of the wildcards whose pipeline kept no source, in pipeline order (phase-03 wildcard-evidence.md FR-59). Present iff at least one and kind is not NO_EVIDENCE.
          maxItems: 33
          items:
            type: string
            minLength: 1
            maxLength: 40

    # ---------- history ----------
    RecentRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RecentRunSummary'

    RecentRunSummary:
      type: object
      description: One COMPLETED (with headline) or STOPPED run; configuration equals getRun.configuration, headline equals the story headline
      required: [id, generationId, kind, createdAt, configuration]
      properties:
        id:
          type: string
          format: uuid
        generationId:
          type: string
        kind:
          $ref: '#/components/schemas/RunKind'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/RunStatus'
        headline:
          type: string
          description: Present iff status is COMPLETED (STOPPED items have none; the UI shows "Stopped")
        configuration:
          $ref: '#/components/schemas/ScenarioConfiguration'

    # ---------- research ----------
    ResearchTopic:
      type: object
      required: [key, label, category, weight, custom]
      properties:
        key:
          type: string
          description: Catalogue wildcard id, or custom-<n> for custom wildcards
          example: biology-new-pandemic
        label:
          type: string
          example: New pandemic
        category:
          type: string
          description: Catalogue category id, or "custom"
          example: biology
        weight:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.8
        custom:
          type: boolean

    ResearchProfile:
      type: object
      description: |
        darkness/optimism/realism = slider value / 10 with exactly one decimal (9 → 0.9); topics = enabled catalogue
        wildcards in request order (weight = intensity / 10), then custom wildcards (key custom-<n>, category custom).
      required: [darkness, optimism, realism, horizon, topics]
      properties:
        darkness:
          type: number
          format: double
          minimum: 0
          maximum: 1
        optimism:
          type: number
          format: double
          minimum: 0
          maximum: 1
        realism:
          type: number
          format: double
          minimum: 0
          maximum: 1
        horizon:
          $ref: '#/components/schemas/HorizonCode'
        topics:
          type: array
          items:
            $ref: '#/components/schemas/ResearchTopic'

    QueryBucket:
      type: string
      enum: [WILDCARD, MAJOR, ADJACENT, UNEXPECTED]

    QueryExpansionMode:
      type: string
      enum: [MODEL, TEMPLATE_FALLBACK]

    BucketAllocation:
      type: object
      required: [bucket, share, queries]
      properties:
        bucket:
          $ref: '#/components/schemas/QueryBucket'
        share:
          type: number
          format: double
          minimum: 0
          maximum: 1
        queries:
          type: integer
          format: int32
          minimum: 0

    SearchQueryStatus:
      type: string
      description: |
        Per planned query. Since phase 03 (wildcard-search.md FR-52) - every query is its own Google News RSS request;
        OK = answered with at least one item; EMPTY = answered with 0 items; FAILED = no usable answer (non-2xx after
        the one retry of a 429, timeout, connection error, not RSS) or cut off / never sent because of the search
        window, the run deadline or a STOP. PENDING until SEARCHING ends. Phase-02 runs used OR-group requests with a
        per-query attribution (news-search.md FR-44, FR-48).
      enum: [PENDING, OK, EMPTY, FAILED]

    SearchQuery:
      type: object
      required: [id, intentId, bucket, text, status, articlesReturned]
      properties:
        id:
          type: string
          example: Q01
        intentId:
          type: string
          example: I01
        bucket:
          $ref: '#/components/schemas/QueryBucket'
        text:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/SearchQueryStatus'
        articlesReturned:
          type: integer
          format: int32
          minimum: 0
          description: Since phase 03 (wildcard-search.md FR-52) the items of the query's own Google News RSS answer (at most the first 100 are read); 0 for EMPTY and FAILED. Phase-02 runs counted the items attributed to the query from its OR-group answer.

    SearchIntent:
      type: object
      required: [id, bucket, description, drivenBy]
      properties:
        id:
          type: string
          example: I01
        bucket:
          $ref: '#/components/schemas/QueryBucket'
        description:
          type: string
          example: Emerging infectious diseases and unusual disease clusters
        topicKey:
          type: string
          description: ResearchTopic key for WILDCARD intents
        category:
          type: string
          description: Catalogue category id for ADJACENT intents derived from a topic category (absent for the generic ADJACENT intent)
          example: biology
        drivenBy:
          type: array
          description: Panel controls that caused this intent, e.g. "New pandemic 8/10", "Darkness 9/10"
          items:
            type: string

    SearchPlan:
      type: object
      description: |
        Runs created since phase 03 - one wildcard pipeline per enabled wildcard (or one General pipeline) in
        `pipelines`; `buckets`, `intents` and `queries` are empty; queryBudget = number of planned queries;
        expansionMode = MODEL iff at least one pipeline has queryMode MODEL (phase-03 wildcard-search.md FR-50, FR-51).
        Older runs - buckets, intents and queries of phase-01 FR-12, no `pipelines`.
      required: [queryBudget, expansionMode, buckets, intents, queries]
      properties:
        queryBudget:
          type: integer
          format: int32
          minimum: 1
        expansionMode:
          $ref: '#/components/schemas/QueryExpansionMode'
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/BucketAllocation'
        intents:
          type: array
          items:
            $ref: '#/components/schemas/SearchIntent'
        queries:
          type: array
          items:
            $ref: '#/components/schemas/SearchQuery'
        pipelines:
          type: array
          description: Wildcard pipelines in profile topic order (catalogue wildcards, then custom wildcards), or the single General pipeline. Always present for runs created since phase 03.
          minItems: 1
          maxItems: 33
          items:
            $ref: '#/components/schemas/WildcardPipeline'

    WildcardPipelineKind:
      type: string
      description: CATALOGUE = an enabled catalogue wildcard; CUSTOM = a custom wildcard; GENERAL = the single pipeline about major current world events used when no wildcard is enabled
      enum: [CATALOGUE, CUSTOM, GENERAL]

    PipelineQuery:
      type: object
      description: One query of a wildcard pipeline, sent as its own Google News RSS request (phase-03 wildcard-search.md FR-51, FR-52)
      required: [id, text, status, articlesReturned]
      properties:
        id:
          type: string
          pattern: '^Q\d{2}$'
          description: Unique in the run - pipeline order, then query order
          example: Q01
        text:
          type: string
          minLength: 1
          maxLength: 120
          description: Plain text of 3–12 words without quotes, parentheses, a standalone OR token or a colon
          example: new pandemic extreme scenario disaster
        status:
          $ref: '#/components/schemas/SearchQueryStatus'
        articlesReturned:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: Items of the query's RSS answer (at most the first 100 are read); 0 for EMPTY and FAILED

    WildcardPipeline:
      type: object
      description: The independent search pipeline of one wildcard - queries, search, selection, retrieval and extraction (phase-03 wildcard-search.md FR-50)
      required: [id, kind, label, heading, queryMode, queries]
      properties:
        id:
          type: string
          pattern: '^W\d{2}$'
          example: W01
        kind:
          $ref: '#/components/schemas/WildcardPipelineKind'
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: Catalogue label, trimmed custom label, or "General"
          example: New pandemic
        level:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          description: The wildcard's intensity; absent for GENERAL
          example: 8
        topicKey:
          type: string
          description: ResearchTopic key (catalogue wildcard id or custom-<n>); absent for GENERAL
          example: biology-new-pandemic
        heading:
          type: string
          description: Display heading - "<label> <level>/10", or "General" for GENERAL
          example: New pandemic 8/10
        queryMode:
          $ref: '#/components/schemas/QueryExpansionMode'
        queries:
          type: array
          description: 3 queries, 2 when more than 8 wildcards are enabled, 3 for GENERAL
          minItems: 2
          maxItems: 3
          items:
            $ref: '#/components/schemas/PipelineQuery'
        candidatesConsidered:
          type: integer
          format: int32
          minimum: 0
          description: Distinct usable search results of this pipeline after basic filtering; set when READING_SOURCES commits
        sourceIds:
          type: array
          description: Kept sources listed under this pipeline, in its relevance order (its own selections and kept sources it found that another pipeline selected); set when READING_SOURCES commits, empty when the wildcard found no source
          items:
            type: string
            pattern: '^S\d{3,}$'

    RunResearch:
      type: object
      required: [runId, profile, counts]
      properties:
        runId:
          type: string
          format: uuid
        profile:
          $ref: '#/components/schemas/ResearchProfile'
        searchPlan:
          $ref: '#/components/schemas/SearchPlan'
        counts:
          $ref: '#/components/schemas/ResearchCounts'

    SourceType:
      type: string
      enum: [OFFICIAL, RESEARCH, NEWS, BLOG, OTHER]

    Source:
      type: object
      required: [id, url, publisher, title, retrievedAt, sourceType, sourceQuality, metadataFetched]
      properties:
        id:
          type: string
          pattern: '^S\d{3,}$'
          example: S001
        url:
          type: string
          format: uri
          description: Normalised article URL. Since phase 03 - the publisher URL obtained by decoding the Google News link, else the Google News link itself (phase-03 article-retrieval.md FR-54)
        publisher:
          type: string
        title:
          type: string
        publishedAt:
          type: string
          format: date-time
        retrievedAt:
          type: string
          format: date-time
        summary:
          type: string
          description: Publisher page description, else the RSS snippet, else the title (at most 600 characters)
        topic:
          type: string
          description: From the first query that returned the article — WILDCARD topicKey, ADJACENT category or "general", "major", "unexpected"; since phase 03 the topicKey of the first pipeline that found it ("major" for the General pipeline)
        entities:
          type: array
          items:
            type: string
        sourceType:
          $ref: '#/components/schemas/SourceType'
        sourceQuality:
          type: number
          format: double
          minimum: 0
          maximum: 1
        metadataFetched:
          type: boolean
          description: false when the article page timed out or was unreachable (provider metadata kept); since phase 03 true iff the publisher page was read (contentStatus RETRIEVED or NO_TEXT)
        queryIds:
          type: array
          description: Ids of every query that returned this (normalized) URL, in query order
          items:
            type: string
        publisherUrl:
          type: string
          format: uri
          description: Publisher site URL of a Google News RSS item (its `<source url>`), absent when the item has none (phase-02 news-search.md FR-48)
        publisherHost:
          type: string
          description: Host of `url` when it is the publisher URL (lower-case, without a leading "www."); absent while `url` is still the Google News link (phase-03 article-retrieval.md FR-54)
          example: reuters.com
        contentStatus:
          $ref: '#/components/schemas/ArticleContentStatus'
        excerpts:
          type: array
          description: Extracted article fragments per wildcard pipeline that lists the source and got at least one fragment, in pipeline order (phase-03 article-retrieval.md FR-55). Always sent for runs created since phase 03 (possibly empty).
          items:
            $ref: '#/components/schemas/SourceExcerpt'
        pipelineIds:
          type: array
          description: Wildcard pipelines whose search results contained this article, ascending (phase-03 wildcard-search.md FR-50). Always sent for runs created since phase 03.
          items:
            type: string
            pattern: '^W\d{2}$'

    ArticleContentStatus:
      type: string
      description: |
        Outcome of the publisher-article retrieval of a source (phase-03 article-retrieval.md FR-54 – FR-56).
        RETRIEVED = publisher page read and at least one fragment extracted; DECODE_FAILED = the Google page, its
        article attributes or the decode call failed, timed out or returned a Google host (url stays the Google
        link); PAGE_FAILED = the publisher page failed, timed out, was not HTML or text, or redirected more than 5
        times; NO_TEXT = page read but no usable paragraph; REFUSED = blocked address or non-http(s) URL;
        NOT_ATTEMPTED = the search budget ended or the run stopped first. Every value but RETRIEVED is shown as
        "content not retrieved". Absent for runs created before phase 03.
      enum: [RETRIEVED, DECODE_FAILED, PAGE_FAILED, NO_TEXT, REFUSED, NOT_ATTEMPTED]

    SourceExcerpt:
      type: object
      description: Up to 3 paragraphs of the article most relevant to one wildcard pipeline, together at most 1,200 characters, ordered by match strength
      required: [pipelineId, fragments]
      properties:
        pipelineId:
          type: string
          pattern: '^W\d{2}$'
        fragments:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            minLength: 1
            maxLength: 1200

    SourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Source'

    Trend:
      type: string
      enum: [EMERGING, ESTABLISHED, DECLINING]

    WildcardMatch:
      type: object
      required: [key, score]
      properties:
        key:
          type: string
          description: ResearchTopic key
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1

    EventClassification:
      type: object
      description: Semantic classification of an event (FR-15). Every number is validated, never clamped.
      required: [topic, subtopics, sentiment, risk, opportunity, impact, novelty, sourceQuality, trend, geography, wildcardMatches]
      properties:
        topic:
          type: string
        subtopics:
          type: array
          items:
            type: string
        sentiment:
          type: number
          format: double
          minimum: -1
          maximum: 1
        risk:
          type: number
          format: double
          minimum: 0
          maximum: 1
        opportunity:
          type: number
          format: double
          minimum: 0
          maximum: 1
        impact:
          type: number
          format: double
          minimum: 0
          maximum: 1
        novelty:
          type: number
          format: double
          minimum: 0
          maximum: 1
        sourceQuality:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Not from the model — maximum sourceQuality of the event's sources
        trend:
          $ref: '#/components/schemas/Trend'
        geography:
          type: string
          description: Country or region the event is about, "global" when not specific
        wildcardMatches:
          type: array
          description: Exactly one entry per ResearchTopic key of the run's profile, in profile order (score 0 when the model gave none); empty without topics
          items:
            $ref: '#/components/schemas/WildcardMatch'

    RankingFactors:
      type: object
      description: Ranking factors (FR-16), each 0..1, rounded HALF_UP to 4 decimals (formulas in research-pipeline.md slice 07)
      required: [topicMatch, wildcardMatch, darknessMatch, optimismMatch, recency, sourceQuality, impact, trendStrength, crossTopic, realismCompatibility]
      properties:
        topicMatch:
          type: number
          format: double
          minimum: 0
          maximum: 1
        wildcardMatch:
          type: number
          format: double
          minimum: 0
          maximum: 1
        darknessMatch:
          type: number
          format: double
          minimum: 0
          maximum: 1
        optimismMatch:
          type: number
          format: double
          minimum: 0
          maximum: 1
        recency:
          type: number
          format: double
          minimum: 0
          maximum: 1
        sourceQuality:
          type: number
          format: double
          minimum: 0
          maximum: 1
        impact:
          type: number
          format: double
          minimum: 0
          maximum: 1
        trendStrength:
          type: number
          format: double
          minimum: 0
          maximum: 1
        crossTopic:
          type: number
          format: double
          minimum: 0
          maximum: 1
        realismCompatibility:
          type: number
          format: double
          minimum: 0
          maximum: 1

    EventRanking:
      type: object
      description: |
        relevance = Σ(weight·factor) / Σweight; reliability = classification.sourceQuality (separate dimension);
        score = relevance × (0.25 + 0.75 × reliability). All values rounded HALF_UP to 4 decimals.
      required: [relevance, reliability, score, factors]
      properties:
        relevance:
          type: number
          format: double
          minimum: 0
          maximum: 1
        reliability:
          type: number
          format: double
          minimum: 0
          maximum: 1
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
        factors:
          $ref: '#/components/schemas/RankingFactors'

    EvidenceSection:
      type: string
      enum: [CORE, SUPPORTING, COUNTER_SIGNAL]

    EventSelection:
      type: object
      description: Set on events that are in a phase-01/02 Evidence Pack (FR-17); evidenceId E001… in order CORE, SUPPORTING, COUNTER_SIGNAL. Never set for runs created since phase 03 - the pack is built from sources per wildcard (phase-03 wildcard-evidence.md FR-57)
      required: [evidenceId, section]
      properties:
        evidenceId:
          type: string
          pattern: '^E\d{3}$'
        section:
          $ref: '#/components/schemas/EvidenceSection'

    NormalizedEvent:
      type: object
      required: [id, category, entities, summary, sourceIds, confidence]
      properties:
        id:
          type: string
          pattern: '^EV\d{3,}$'
          example: EV001
        date:
          type: string
          format: date
          description: Event date (UTC); absent when neither the model nor any source gave one
        category:
          type: string
        entities:
          type: array
          description: Trimmed, case-insensitively unique, in model order; copied to the entities of every source of the event
          items:
            type: string
        summary:
          type: string
          maxLength: 600
          description: When `disagreement` is set the summary contains "Reports differ on …"
        disagreement:
          type: string
          description: Set when credible sources disagree; the summary also states it
        sourceIds:
          type: array
          minItems: 1
          description: Ids of every source reporting the event, ascending (S001 before S002)
          items:
            type: string
            pattern: '^S\d{3,}$'
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        classification:
          $ref: '#/components/schemas/EventClassification'
        ranking:
          $ref: '#/components/schemas/EventRanking'
        selection:
          $ref: '#/components/schemas/EventSelection'
        excludedReason:
          type: string
          description: |
            Why the event cannot be selected; one of CLASSIFICATION_FAILED, LOW_SOURCE_QUALITY. CLASSIFICATION_FAILED (FR-15) — `classification` and `ranking` absent.
            LOW_SOURCE_QUALITY (FR-16) — ranked (`ranking` present) but sourceQuality below oracul.ranking.min-source-quality (0.30).

    EventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NormalizedEvent'

    EvidenceItem:
      type: object
      description: One selected event as stored on the event (unsanitized); the sanitized form is in EvidencePack.promptText
      required: [evidenceId, section, eventId, category, summary, entities, sourceIds, sourceQuality, confidence]
      properties:
        evidenceId:
          type: string
          pattern: '^E\d{3}$'
          example: E001
        section:
          $ref: '#/components/schemas/EvidenceSection'
        eventId:
          type: string
          pattern: '^EV\d{3,}$'
        date:
          type: string
          format: date
        category:
          type: string
        summary:
          type: string
        disagreement:
          type: string
        entities:
          type: array
          items:
            type: string
        sourceIds:
          type: array
          minItems: 1
          description: Every source id of the event, ascending
          items:
            type: string
            pattern: '^S\d{3,}$'
        sourceQuality:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: classification.sourceQuality of the event
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1

    EvidencePack:
      type: object
      description: |
        Immutable Evidence Pack of a run. Packs built since phase 03 (wildcard-evidence.md FR-57) - core, supporting
        and counterSignals are empty and wildcardSections holds one section per wildcard pipeline; Evidence IDs are
        the source numbers (E00k = S00k). Older packs (FR-18) - items in Evidence-ID order within core, supporting and
        counterSignals, no wildcardSections.
      required: [id, generationId, cutoff, configuration, profile, core, supporting, counterSignals, sources, promptText]
      properties:
        id:
          type: string
          format: uuid
        generationId:
          type: string
          pattern: '^ORC-\d{4}-\d{2}-\d{2}-\d{4}(-\d+)?$'
        cutoff:
          type: string
          format: date-time
          description: Instant of pack creation, UTC, truncated to the minute (seconds 0)
        configuration:
          $ref: '#/components/schemas/ScenarioConfiguration'
        profile:
          $ref: '#/components/schemas/ResearchProfile'
        core:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceItem'
        supporting:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceItem'
        counterSignals:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceItem'
        sources:
          type: array
          description: Every source referenced by any evidence item, by id ascending. Packs built since phase 03 - every kept source of the run (each is listed in at least one wildcard section), by id ascending
          items:
            $ref: '#/components/schemas/Source'
        promptText:
          type: string
          description: |
            Exact rendered pack text placed in the untrusted `evidence-pack` data block of the generation and critic
            prompts; text fields sanitized. Since phase 03 - scenario parameters, then one section per wildcard
            (headings "Wildcard: <label> <level>/10", exact layout in wildcard-evidence.md FR-57); earlier -
            CORE / SUPPORTING / COUNTER-SIGNALS sections (research-pipeline.md slice 07).
        wildcardSections:
          type: array
          description: One section per wildcard pipeline in plan order, also for pipelines without sources (empty items). Always present for packs built since phase 03.
          items:
            $ref: '#/components/schemas/PackWildcardSection'

    PackWildcardSection:
      type: object
      description: The Evidence Pack section of one wildcard pipeline (phase-03 wildcard-evidence.md FR-57)
      required: [pipelineId, kind, label, heading, items]
      properties:
        pipelineId:
          type: string
          pattern: '^W\d{2}$'
        kind:
          $ref: '#/components/schemas/WildcardPipelineKind'
        label:
          type: string
          minLength: 1
          maxLength: 40
        level:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          description: Absent for GENERAL
        heading:
          type: string
          example: New pandemic 8/10
        items:
          type: array
          description: The pipeline's kept sources in its relevance order; empty means "no current sources found"
          items:
            $ref: '#/components/schemas/PackSourceItem'

    PackSourceItem:
      type: object
      description: One source as evidence of one wildcard section; values as stored on the source (unsanitized), fragments of this section's pipeline
      required: [evidenceId, sourceId, title, publisher, url, contentRetrieved, fragments]
      properties:
        evidenceId:
          type: string
          pattern: '^E\d{3}$'
          example: E001
        sourceId:
          type: string
          pattern: '^S\d{3,}$'
          example: S001
        title:
          type: string
        publisher:
          type: string
        publishedAt:
          type: string
          format: date-time
        url:
          type: string
          format: uri
        contentRetrieved:
          type: boolean
          description: True iff this pipeline has at least one extracted fragment of the article
        fragments:
          type: array
          maxItems: 3
          description: This pipeline's fragments (at most 1,200 characters together); empty when contentRetrieved is false
          items:
            type: string
        snippet:
          type: string
          maxLength: 600
          description: Present iff contentRetrieved is false - the stored source summary (else its title), at most 600 characters, that stands in for the article text

    # ---------- reasoning ----------
    InformationClass:
      type: string
      enum: [FACT, INFERENCE, SPECULATION, FUTURE_EVENT]

    CandidateFuture:
      type: object
      required: [title, summary, evaluation, selected]
      properties:
        title:
          type: string
        summary:
          type: string
        evaluation:
          type: string
        selected:
          type: boolean

    FactClaim:
      type: object
      required: [id, statement, evidenceIds]
      properties:
        id:
          type: string
          pattern: '^F[1-9][0-9]*$'
          example: F1
        statement:
          type: string
        evidenceIds:
          type: array
          items:
            type: string

    InferenceClaim:
      type: object
      required: [id, statement, basedOn, evidenceIds]
      properties:
        id:
          type: string
          pattern: '^I[1-9][0-9]*$'
          example: I1
        statement:
          type: string
        basedOn:
          type: array
          description: Fact ids this inference derives from
          items:
            type: string
        evidenceIds:
          type: array
          items:
            type: string

    SpeculationClaim:
      type: object
      required: [id, statement, basedOn]
      properties:
        id:
          type: string
          pattern: '^P[1-9][0-9]*$'
          example: P1
        statement:
          type: string
        basedOn:
          type: array
          description: Fact or inference ids
          items:
            type: string

    CounterSignalConsideration:
      type: object
      required: [evidenceId, howAddressed]
      properties:
        evidenceId:
          type: string
        howAddressed:
          type: string

    CausalStep:
      type: object
      required: [order, informationClass, statement, evidenceIds]
      properties:
        order:
          type: integer
          format: int32
          minimum: 1
        informationClass:
          $ref: '#/components/schemas/InformationClass'
        claimId:
          type: string
          description: F1 / I1 / P1 of the claim this step shows
        statement:
          type: string
        evidenceIds:
          type: array
          description: Evidence IDs of the step; the WHY panel shows them as chips on FACT and INFERENCE steps (FR-26)
          items:
            type: string
        year:
          type: integer
          format: int32
          description: Set on the FUTURE_EVENT step

    FutureEvent:
      type: object
      required: [title, summary, date]
      properties:
        title:
          type: string
        summary:
          type: string
        date:
          type: string
          format: date
          description: Strictly after the cutoff date and within the horizon

    StructuredScenario:
      type: object
      required: [candidateFutures, factsUsed, inferences, speculations, counterSignalsConsidered, causalChain, futureEvent]
      properties:
        candidateFutures:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/CandidateFuture'
        factsUsed:
          type: array
          items:
            $ref: '#/components/schemas/FactClaim'
        inferences:
          type: array
          items:
            $ref: '#/components/schemas/InferenceClaim'
        speculations:
          type: array
          items:
            $ref: '#/components/schemas/SpeculationClaim'
        counterSignalsConsidered:
          type: array
          items:
            $ref: '#/components/schemas/CounterSignalConsideration'
        causalChain:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/CausalStep'
        futureEvent:
          $ref: '#/components/schemas/FutureEvent'
        unknowns:
          type: array
          description: Information the model stated as unknown
          items:
            type: string

    GuardOutcome:
      type: string
      enum: [PASS, PASS_WITH_REMOVALS, FAIL]

    GuardViolationType:
      type: string
      enum:
        - FACT_WITHOUT_EVIDENCE
        - UNKNOWN_EVIDENCE_ID
        - UNSUPPORTED_INFERENCE
        - PRESENT_DAY_CLAIM_WITHOUT_EVIDENCE
        - CAUSAL_CHAIN_INVALID
        - FUTURE_EVENT_NOT_IN_HORIZON

    GuardAction:
      type: string
      enum: [REMOVED, REGENERATION_REQUESTED, REJECTED]

    GuardViolation:
      type: object
      required: [type, detail, action]
      properties:
        type:
          $ref: '#/components/schemas/GuardViolationType'
        claimId:
          type: string
        evidenceId:
          type: string
        detail:
          type: string
        action:
          $ref: '#/components/schemas/GuardAction'

    GuardReport:
      type: object
      required: [outcome, violations, attempt]
      properties:
        outcome:
          $ref: '#/components/schemas/GuardOutcome'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/GuardViolation'
        attempt:
          type: integer
          format: int32
          minimum: 1

    CriticVerdict:
      type: string
      enum: [PASS, FAIL]

    CriticIssueType:
      type: string
      description: IGNORED_COUNTER_SIGNALS is no longer requested or accepted since phase 03 (wildcard-evidence.md FR-58); stored reports keep it
      enum:
        - UNSUPPORTED_FACTUAL_JUMP
        - CONTRADICTION
        - UNREALISTIC_TIMELINE
        - IGNORED_COUNTER_SIGNALS
        - WILDCARD_FORCING
        - SETTINGS_MISMATCH
        - INAPPROPRIATE_CERTAINTY

    CriticIssue:
      type: object
      required: [type, description]
      properties:
        type:
          $ref: '#/components/schemas/CriticIssueType'
        description:
          type: string
          minLength: 1
          maxLength: 301
          description: Model-written, normalized by ORACUL (control characters → space, whitespace collapsed, trimmed, longer than 300 code points → first 300 + "…"); display as text only

    CriticReport:
      type: object
      description: Result of the SCENARIO_CRITIC check of one scenario attempt. FAIL ⇔ at least one issue.
      required: [verdict, issues, attempt]
      properties:
        verdict:
          $ref: '#/components/schemas/CriticVerdict'
        issues:
          type: array
          maxItems: 10
          description: Empty for PASS; 1–10 issues in model order for FAIL
          items:
            $ref: '#/components/schemas/CriticIssue'
        attempt:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          description: Scenario attempt number that was critiqued

    ScenarioAttemptReason:
      type: string
      enum: [INITIAL, SCHEMA_CORRECTION, GUARD_REGENERATION, CRITIC_REGENERATION, ALTERNATIVE_DISTINCT]

    ScenarioAttemptSummary:
      type: object
      description: One SCENARIO_GENERATION call of the run (a transport retry is not a new attempt)
      required: [attempt, reason, parsed, schemaErrors]
      properties:
        attempt:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
        reason:
          $ref: '#/components/schemas/ScenarioAttemptReason'
        parsed:
          type: boolean
          description: The output was a valid StructuredScenario
        schemaErrors:
          type: array
          description: Parser errors (scenario-reasoning.md FR-20), empty when parsed
          items:
            type: string

    StructuredScenarioRecord:
      type: object
      required: [runId, evidencePackId, attempt, accepted, structuredScenario, guardReports, criticReports, generationAttempts, attempts]
      properties:
        runId:
          type: string
          format: uuid
        evidencePackId:
          type: string
          format: uuid
        attempt:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          description: Attempt number of `structuredScenario` (latest attempt with a parsed scenario)
        accepted:
          type: boolean
          description: True when `attempt` is the run's accepted (final) scenario
        structuredScenario:
          $ref: '#/components/schemas/StructuredScenario'
        guardReports:
          type: array
          description: One per guard execution, oldest first
          items:
            $ref: '#/components/schemas/GuardReport'
        criticReports:
          type: array
          description: One per critic execution, oldest first
          items:
            $ref: '#/components/schemas/CriticReport'
        generationAttempts:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          description: Generation calls made for this run (each attempt reason at most once)
        attempts:
          type: array
          description: Every generation attempt, attempt ascending
          items:
            $ref: '#/components/schemas/ScenarioAttemptSummary'

    # ---------- result ----------
    FutureStory:
      type: object
      required: [headline, dateline, futureDate, body]
      properties:
        headline:
          type: string
          minLength: 1
          maxLength: 160
          description: Single line, trimmed, whitespace collapsed
        dateline:
          type: string
          pattern: '^ORACUL FUTURE — (January|February|March|April|May|June|July|August|September|October|November|December) [1-9][0-9]?, [0-9]{4}$'
          description: Built by ORACUL from futureDate (the model's dateline is ignored)
          example: ORACUL FUTURE — March 14, 2031
        futureDate:
          type: string
          format: date
          description: After the Evidence Pack cutoff date and no later than cutoff date + horizon (never the cutoff day itself)
          example: '2031-03-14'
        body:
          type: string
          minLength: 1
          description: Plain text, 150–900 words, paragraphs separated by exactly one blank line ("\n\n"), no HTML or Markdown

    WildcardDisplay:
      type: object
      required: [label, intensity, custom]
      properties:
        label:
          type: string
          description: Catalogue label (e.g. "New pandemic") or the custom wildcard label
          example: New pandemic
        intensity:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          example: 8
        custom:
          type: boolean

    ScenarioMetadata:
      type: object
      required: [configuration, horizonLabel, wildcards, counts]
      properties:
        configuration:
          $ref: '#/components/schemas/ScenarioConfiguration'
        horizonLabel:
          type: string
          description: Tomorrow · 1 week · 1 month · 1 year · 5 years · 10 years · 20 years
          example: 5 years
        wildcards:
          type: array
          description: Catalogue wildcards of the configuration in configuration order, then custom wildcards in configuration order; [] when none
          items:
            $ref: '#/components/schemas/WildcardDisplay'
        counts:
          $ref: '#/components/schemas/ResearchCounts'
        model:
          type: string
          minLength: 1
          maxLength: 128
          description: Model slug actually used for this run, chosen from the signed-in account's GET /v1/models catalogue (phase-02 chatgpt-inference.md FR-38). Absent for runs created before phase 02.
          example: gpt-5

    ResultSource:
      type: object
      description: One Evidence Pack item (FR-27); title, publisher, publishedAt and url are those of the item's first (highest-quality) source. For packs built since phase 03 one entry per source with section CORE and counterSignal false; the SOURCES panel then renders wildcardGroups instead (wildcard-result-views.md FR-60)
      required: [evidenceId, section, title, publisher, url, usedInScenario, counterSignal]
      properties:
        evidenceId:
          type: string
          example: E001
        section:
          $ref: '#/components/schemas/EvidenceSection'
        title:
          type: string
          description: Empty when unknown (UI shows "Untitled source")
        publisher:
          type: string
          description: Empty when unknown (UI shows "Unknown publisher")
        publishedAt:
          type: string
          format: date-time
          description: Absent when unknown (UI shows "date unknown")
        url:
          type: string
          format: uri
          description: Link to the real source; the UI renders it as a new-tab link only for http/https
        usedInScenario:
          type: boolean
          description: True iff the evidenceId is cited by a fact of the accepted scenario's factsUsed (UI badge "used in scenario")
        counterSignal:
          type: boolean
          description: True iff section is COUNTER_SIGNAL (UI badge "counter-signal")

    ResearchExplanation:
      type: object
      description: Data of the WHY THESE NEWS? panel (FR-28); the result view never calls getRunResearch for it. For runs with wildcard pipelines (since phase 03) intents is empty and the panel renders FutureResult.wildcardGroups with these counts
      required: [intents, counts]
      properties:
        intents:
          type: array
          description: The run's search-plan intents in plan order, identical to getRunResearch searchPlan.intents (incl. drivenBy); [] when the run has no search plan
          items:
            $ref: '#/components/schemas/SearchIntent'
        counts:
          $ref: '#/components/schemas/ResearchCounts'

    FutureResult:
      type: object
      required: [runId, generationId, labels, story, metadata, causalChain, sources, research, openCriticIssues]
      properties:
        runId:
          type: string
          format: uuid
        generationId:
          type: string
        labels:
          type: array
          description: Always exactly ["AI-GENERATED FUTURE SCENARIO", "POSSIBLE FUTURE — NOT CURRENT NEWS"] in this order
          minItems: 2
          maxItems: 2
          items:
            type: string
        story:
          $ref: '#/components/schemas/FutureStory'
        metadata:
          $ref: '#/components/schemas/ScenarioMetadata'
        causalChain:
          type: array
          description: Causal chain of the accepted (guard-cleaned) structured scenario, equal to getStructuredScenario.structuredScenario.causalChain
          items:
            $ref: '#/components/schemas/CausalStep'
        sources:
          type: array
          description: One entry per Evidence Pack item (core, supporting, counter-signals) in Evidence ID order. Packs with wildcardSections (since phase 03) - one entry per distinct Evidence ID of the sections, section CORE, counterSignal false
          items:
            $ref: '#/components/schemas/ResultSource'
        research:
          $ref: '#/components/schemas/ResearchExplanation'
        openCriticIssues:
          type: array
          maxItems: 10
          description: Issues of the accepted attempt's critic report when its verdict is FAIL (the critic failed twice and the Evidence Guard passed, so the story was written anyway); [] otherwise. Non-empty ⇔ getRun.hasOpenCriticIssues
          items:
            $ref: '#/components/schemas/CriticIssue'
        wildcardGroups:
          type: array
          description: Present iff the run (for an ALTERNATIVE run the run that built the pack) has wildcard pipelines (since phase 03) - one group per pipeline in plan order, also for pipelines without sources (phase-03 wildcard-result-views.md FR-60)
          items:
            $ref: '#/components/schemas/ResultWildcardGroup'

    ResultWildcardGroup:
      type: object
      description: One wildcard group of the SOURCES and WHY THESE NEWS? panels
      required: [pipelineId, kind, label, heading, queries, sources]
      properties:
        pipelineId:
          type: string
          pattern: '^W\d{2}$'
        kind:
          $ref: '#/components/schemas/WildcardPipelineKind'
        label:
          type: string
          minLength: 1
          maxLength: 40
        level:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          description: Absent for GENERAL
        heading:
          type: string
          description: Group title - "<label> <level>/10", or "General"
          example: New pandemic 8/10
        queries:
          type: array
          description: The pipeline's queries with status and item count, in plan order
          items:
            $ref: '#/components/schemas/PipelineQuery'
        sources:
          type: array
          description: The pipeline's Evidence Pack section items in section order; empty means "no current sources found"
          items:
            $ref: '#/components/schemas/ResultGroupSource'

    ResultGroupSource:
      type: object
      description: One source of a wildcard group as shown in the SOURCES panel
      required: [evidenceId, sourceId, title, publisher, url, contentRetrieved, fragments, usedInScenario]
      properties:
        evidenceId:
          type: string
          pattern: '^E\d{3}$'
          example: E001
        sourceId:
          type: string
          pattern: '^S\d{3,}$'
        title:
          type: string
          description: Empty when unknown (UI shows "Untitled source")
        publisher:
          type: string
          description: Empty when unknown (UI shows "Unknown publisher")
        publishedAt:
          type: string
          format: date-time
          description: Absent when unknown (UI shows "date unknown")
        url:
          type: string
          format: uri
          description: Publisher URL, or the Google News link when it could not be decoded; the UI renders a new-tab link only for http/https
        contentRetrieved:
          type: boolean
          description: False → the UI shows "content not retrieved" instead of an excerpt
        fragments:
          type: array
          maxItems: 3
          description: This group's extracted fragments (the excerpt); empty when contentRetrieved is false
          items:
            type: string
        usedInScenario:
          type: boolean
          description: True iff the evidenceId is cited by a fact of the accepted scenario's factsUsed
